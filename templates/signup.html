<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RiskMate – Create Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a3a5f 0%, #2c5282 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .signup-container {
            max-width: 520px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .signup-header {
            background: #1a3a5f;
            color: white;
            padding: 2rem 2rem;
            text-align: center;
        }

        .signup-header i {
            font-size: 3rem;
            color: #0e9f6e;
            margin-bottom: 0.75rem;
        }

        .signup-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .signup-header p {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.75);
        }

        .signup-body {
            padding: 2rem 2rem 2rem 2rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }

        .form-label i {
            margin-right: 0.5rem;
            color: #0e9f6e;
            width: 1.1rem;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s ease;
            outline: none;
            background: #f8fafc;
        }

        .form-input:focus, .form-select:focus {
            border-color: #0e9f6e;
            background: white;
            box-shadow: 0 0 0 3px rgba(14, 159, 110, 0.1);
        }

        .info-text {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 0.35rem;
        }

        .btn-signup {
            width: 100%;
            background: #0e9f6e;
            color: white;
            padding: 0.9rem;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            margin-top: 0.5rem;
        }

        .btn-signup:hover {
            background: #0c7a55;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(14, 159, 110, 0.3);
        }

        .login-link {
            text-align: center;
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px solid #e2e8f0;
            font-size: 0.85rem;
            color: #64748b;
        }

        .login-link a {
            color: #0e9f6e;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .alert {
            padding: 0.85rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: none;
        }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
        }

        .alert-success {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #15803d;
        }

        .alert i {
            margin-right: 0.5rem;
        }

        .alert ul {
            margin-left: 1.5rem;
            margin-top: 0.3rem;
            margin-bottom: 0;
        }

        .password-strength {
            height: 4px;
            background: #e2e8f0;
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <div class="signup-container">
        <div class="signup-header">
            <i class="fas fa-shield-alt"></i>
            <h1>Create Account</h1>
            <p>Join RiskMate to start managing your risks</p>
        </div>
        <div class="signup-body">
            <div id="errorMessage" class="alert alert-error">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText"></span>
            </div>
            <div id="successMessage" class="alert alert-success">
                <i class="fas fa-check-circle"></i>
                <span id="successText"></span>
            </div>

            <form id="signupForm">
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text" class="form-input" id="username" name="username" 
                           placeholder="e.g., johndoe_01 or admin_01" autocomplete="off" required>
                    <div class="info-text">✓ 3-20 characters ✓ letters, numbers, underscores only</div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-envelope"></i> Email Address
                    </label>
                    <input type="email" class="form-input" id="email" name="email" 
                           placeholder="your@email.com" autocomplete="off" required>
                    <div class="info-text">✓ Must be a valid email address</div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" class="form-input" id="password" name="password" 
                           placeholder="••••••••" required>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="passwordStrengthBar"></div>
                    </div>
                    <div class="info-text">✓ Minimum 6 characters</div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-check-circle"></i> Confirm Password
                    </label>
                    <input type="password" class="form-input" id="confirmPassword" name="confirm_password" 
                           placeholder="••••••••" required>
                    <div class="info-text" id="passwordMatchMsg"></div>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-briefcase"></i> Role
                    </label>
                    <select class="form-select" id="role" name="role">
                        <option value="Security Analyst">Security Analyst</option>
                        <option value="Security Engineer">Security Engineer</option>
                        <option value="Security Admin">Security Admin</option>
                    </select>
                    <div class="info-text">✓ Choose based on your responsibilities</div>
                </div>

                <button type="submit" class="btn-signup">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
            </form>

            <div class="login-link">
                Already have an account? <a href="/">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('signupForm');
        const errorDiv = document.getElementById('errorMessage');
        const successDiv = document.getElementById('successMessage');
        const errorText = document.getElementById('errorText');
        const successText = document.getElementById('successText');
        const passwordInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const strengthBar = document.getElementById('passwordStrengthBar');
        const matchMsg = document.getElementById('passwordMatchMsg');

        // Password strength checker
        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 6) strength++;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            let percentage = Math.min(100, strength * 20);
            let color = '#dc2626'; // red
            
            if (percentage >= 80) color = '#10b981'; // green
            else if (percentage >= 60) color = '#f59e0b'; // yellow
            else if (percentage >= 40) color = '#f97316'; // orange
            
            strengthBar.style.width = percentage + '%';
            strengthBar.style.backgroundColor = color;
            
            return percentage;
        }

        passwordInput.addEventListener('input', function() {
            checkPasswordStrength(this.value);
            checkPasswordMatch();
        });

        confirmInput.addEventListener('input', checkPasswordMatch);

        function checkPasswordMatch() {
            if (confirmInput.value.length > 0) {
                if (passwordInput.value === confirmInput.value) {
                    matchMsg.innerHTML = '✓ Passwords match';
                    matchMsg.style.color = '#10b981';
                } else {
                    matchMsg.innerHTML = '✗ Passwords do not match';
                    matchMsg.style.color = '#dc2626';
                }
            } else {
                matchMsg.innerHTML = '';
            }
        }

        function showError(message, isArray = false) {
            if (isArray && Array.isArray(message)) {
                let html = '<ul>';
                message.forEach(err => {
                    html += `<li>${err}</li>`;
                });
                html += '</ul>';
                errorText.innerHTML = html;
            } else {
                errorText.innerHTML = message;
            }
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            successText.innerHTML = message;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const role = document.getElementById('role').value;

            const formData = {
                username: username,
                email: email,
                password: password,
                confirm_password: confirmPassword,
                role: role
            };

            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess(data.message);
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 2000);
                } else {
                    if (data.errors && Array.isArray(data.errors)) {
                        showError(data.errors, true);
                    } else {
                        showError(data.error || 'Registration failed. Please try again.');
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                showError('Network error. Please check your connection and try again.');
            }
        });
    </script>
</body>
</html>
